plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.fourbasicopt'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.fourbasicopt'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
